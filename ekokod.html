<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>2050 жылдан қашу</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one dark "mission console" column; a sticky header holds the eco-coin counter and the 4-digit code that fills as games are won */
:root {
  --bg: #0E211D; --panel: #16312B; --panel-2: #1D3F38; --line: #2C5249;
  --fg: #F3EFE4; --muted: #A9C2BB; --amber: #F0A85A; --clay: #D9793A;
  --good: #5FD39B; --bad: #FF7A6B;
  --display: 'Montserrat', 'Arial Black', Arial, sans-serif;
  --body: 'Nunito', 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; }
* { box-sizing: border-box; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-in { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: .3px; margin-right: auto; }
.brand span { color: var(--amber); }
.coins { display: flex; align-items: center; gap: 8px; font-weight: 800; font-variant-numeric: tabular-nums; }
.coins img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; object-position: center top; }
.coins.bump { animation: bump .5s ease; }
.code { display: flex; gap: 6px; }
.slot { width: 34px; height: 42px; border-radius: 8px; border: 2px dashed var(--clay); display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--amber); perspective: 400px; }
.slot.on { border-style: solid; background: #2A1D12; animation: flip .7s ease; }

nav.tabs { max-width: 1040px; margin: 0 auto; display: flex; gap: 6px; overflow-x: auto; padding-top: 10px; }
nav.tabs button { flex: none; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700; color: var(--muted); }
nav.tabs button[aria-current="true"] { background: var(--amber); color: #2A1608; border-color: var(--amber); }
nav.tabs button.done::after { content: " ✓"; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
.wrap { max-width: 1040px; margin: 0 auto; }
section.screen { animation: rise .45s ease; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: var(--amber); }
h1, h2 { font-family: var(--display); font-weight: 800; line-height: 1.08; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(34px, 6vw, 60px); }
h2 { font-size: clamp(28px, 4.4vw, 42px); }
p { margin: 0; }
.lead { color: var(--muted); max-width: 62ch; font-size: 17px; }
.btn { background: var(--amber); color: #2A1608; border: none; border-radius: 12px; padding: 12px 22px; font-weight: 800; font-size: 16px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* hero */
.hero { position: relative; border-radius: 22px; overflow: hidden; min-height: 360px; display: flex; align-items: flex-end; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 45%; animation: drift 22s ease-in-out infinite alternate; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,20,17,.95) 0%, rgba(8,20,17,.75) 50%, rgba(8,20,17,.1) 100%); }
.hero-in { position: relative; z-index: 1; padding: 32px; display: flex; flex-direction: column; gap: 14px; max-width: 640px; }
.sos { font-family: var(--display); color: var(--amber); font-weight: 800; letter-spacing: 6px; animation: blink 1.6s steps(2) infinite; }
.letter { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; font-size: 17px; max-width: 70ch; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px; color: var(--muted); }
input[type=text] { background: var(--panel-2); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; padding: 10px 12px; font: inherit; min-width: 0; width: min(320px, 100%); }

/* prompt bar */
.ask { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.ask strong { font-family: var(--display); font-size: 20px; }
.pill { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--panel-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.feedback { min-height: 26px; font-weight: 700; }
.feedback.good { color: var(--good); } .feedback.bad { color: var(--bad); }

/* puzzle grid */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 14px; }
.tile { position: relative; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 0; overflow: hidden; text-align: left; transition: transform .2s ease, border-color .2s ease; }
.tile:hover { transform: translateY(-3px); border-color: var(--amber); }
.tile img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
.tile .cap { padding: 10px 12px; min-height: 44px; font-weight: 700; font-size: 14px; color: var(--muted); }
.tile.solved { border-color: var(--good); cursor: default; transform: none; }
.tile.solved .cap { color: var(--fg); }
.tile.solved::after { content: "✓"; position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; background: var(--good); color: #0E211D; display: grid; place-items: center; font-weight: 800; animation: pop .4s ease; }
.shake { animation: shake .45s ease; border-color: var(--bad) !important; }

/* choice cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.quote { font-size: clamp(19px, 2.6vw, 24px); font-weight: 700; line-height: 1.4; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px; }
.choice { background: var(--panel-2); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; text-align: left; font-weight: 700; min-height: 56px; transition: transform .15s ease; }
.choice:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--amber); }
.choice svg { flex: none; }
.choice.right { border-color: var(--good); background: #173F31; }
.choice.wrong { border-color: var(--bad); }
.choice:disabled { cursor: default; }
.explain { background: #173F31; border-left: 4px solid var(--good); border-radius: 10px; padding: 12px 14px; animation: rise .35s ease; }
.explain.no { background: #3D1F1A; border-left-color: var(--bad); }

/* sort */
.deck { display: grid; place-items: center; min-height: 150px; }
.sortcard { background: var(--fg); color: #14302B; border-radius: 18px; padding: 24px 28px; font-size: clamp(20px, 3vw, 26px); font-weight: 800; text-align: center; max-width: 560px; box-shadow: 0 14px 30px rgba(0,0,0,.35); animation: deal .4s ease; }
.sortcard.fly { animation: fly .45s ease forwards; }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 10px; }
.group { background: var(--panel-2); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; text-align: left; font-weight: 700; font-size: 15px; }
.group img { width: 52px; height: 42px; object-fit: cover; border-radius: 8px; flex: none; }
.group:hover { border-color: var(--amber); }

/* liar */
.trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; }
.claim { background: var(--panel-2); border: 2px solid var(--line); border-radius: 16px; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 8px; transition: transform .15s ease; }
.claim:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--amber); }
.claim b { font-family: var(--display); font-size: 30px; color: var(--amber); }
.claim.lie { border-color: var(--good); background: #173F31; }
.claim.miss { border-color: var(--bad); }

/* win banner */
.win { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; background: linear-gradient(90deg, #2A1D12, var(--panel)); border: 1px solid var(--clay); border-radius: 18px; padding: 18px 20px; animation: rise .5s ease; }
.bigdigit { font-family: var(--display); font-size: 64px; font-weight: 800; color: var(--amber); width: 84px; height: 96px; border-radius: 14px; background: #1A120B; border: 2px solid var(--clay); display: grid; place-items: center; animation: flip .8s ease; }

/* final */
.lock { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.lock input { width: 64px; height: 78px; text-align: center; font-family: var(--display); font-size: 40px; font-weight: 800; background: var(--panel-2); border: 2px solid var(--clay); border-radius: 12px; color: var(--amber); }
.padlock { width: 84px; height: 96px; }
.padlock .shackle { transition: transform .6s cubic-bezier(.5,-0.4,.4,1.6); transform-origin: 70% 100%; }
.padlock.open .shackle { transform: translateY(-14px) rotate(25deg); }
.typed { white-space: pre-wrap; font-size: 18px; line-height: 1.65; }
.typed::after { content: "▍"; color: var(--amber); animation: blink 1s steps(2) infinite; }
.typed.done::after { content: ""; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall linear forwards; }
.note { font-size: 13px; color: var(--muted); }

@keyframes rise { from { opacity: .3; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes flip { 0% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
@keyframes bump { 0%,100% { transform: scale(1); } 40% { transform: scale(1.25); } }
@keyframes deal { from { opacity: 0; transform: translateY(-30px) rotate(-4deg); } to { opacity: 1; transform: none; } }
@keyframes fly { to { opacity: 0; transform: translateY(40px) scale(.7) rotate(6deg); } }
@keyframes blink { 50% { opacity: .25; } }
@keyframes drift { from { transform: scale(1.05) translateX(0); } to { transform: scale(1.12) translateX(-2%); } }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

    { t: '2-раунд · Шөлейттену (55 б.)', c: ['Шөлейттенуге тек табиғи құрғақшылық себеп, адамның қатысы жоқ', 'Жер шарында жылына 50-ден 70 мың км² құнарлы жер жарамсыз болып табылуда', 'XX ғасырда шөлейттену үдерісі экологиялық және әлеуметтік-экономикалық ғаламдық мәселеге айналды'], lie: 0, why: 'Оқулықта: Жер шары халқы санының күрт өсуі, жерлердің толық игерілуі, табиғи ортаға техногендік әсер салмағының артуы бұл үдерісті одан әрі күшейтуде.' },
    { t: '3-раунд · Жылыжай эффектісі (21-сурет, 55 б.)', c: ['Келетін күн радиациясы — 343 Вт/м²', 'Жылыжай газдары инфрақызыл радиацияны мүлде ұстамайды, Жерді салқындатады', 'Күн энергиясы жер бетіне жұтылып, оны 168 Вт/м² мөлшерінде жылытады'], lie: 1, why: 'Оқулықта: инфрақызыл радиацияның бір бөлігі жұтылады, оны жылыжай газдарының молекулалары ұстап қалады.' }
  ];
  const DIGITS = ['7', '1', '6', '8'];
  const LETTER = 'Қымбатты 10 «Б» сыныбы!\n\nМен — 2050 жылғы Қазақстанмын. 2026 жылы сендер табиғатқа зиян келтіретін антропогендік факторларды тауып, оларды азайтудың жолын іздедіңдер.\n\nСол ұсыныстардың арқасында Ертіс бойындағы ормандар қайта көктеді, Солтүстік Аралдың суы молайды, Теміртаудың аспаны ашылды. Алматыда электр көліктері мен велосипед жолдары көбейді, Астананың айналасында жасыл белдеу өсті.\n\nМұның бәрі бір сабақтан, бір сұрақтан басталды. Рақмет сендерге, планетаны құтқарушылар!';

  const TABS = [['start', 'Бастау'], ['g1', '1. Пазл'], ['g2', '2. Детектив'], ['g3', '3. Сұрыптау'], ['g4', '4. Өтірікші'], ['final', 'Финал']];
  const st = { view: 'start', coins: 0, team: '', won: [false, false, false, false],
    g1: null, g2: null, g3: null, g4: null };
  const app = document.getElementById('app');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function addCoins(n) {
    st.coins += n; document.getElementById('coinNum').textContent = st.coins;
    const c = document.getElementById('coins'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
  }
  function shakeEl(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  function confetti(n) {
    const box = document.getElementById('confetti'); const cols = ['#F0A85A', '#5FD39B', '#F3EFE4', '#D9793A', '#7FC8F8'];
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i'); p.style.left = Math.random() * 100 + 'vw'; p.style.background = cols[i % cols.length];
      p.style.animationDuration = (1.8 + Math.random() * 1.8) + 's'; p.style.animationDelay = (Math.random() * .6) + 's';
      box.appendChild(p); setTimeout(() => p.remove(), 4500);
    }
  }
  function winGame(i) {
    if (st.won[i]) return;
    st.won[i] = true; const s = document.getElementById('s' + i); s.textContent = DIGITS[i]; s.classList.add('on');
    confetti(70); renderTabs();
  }
  function winBanner(i, text) {
    return '<div class="win"><div class="bigdigit">' + DIGITS[i] + '</div><div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex:1"><p class="eyebrow">' + (i + 1) + '-цифр ашылды!</p><p style="font-size:17px">' + text + '</p><div class="row"><button class="btn" data-go="' + TABS[i + 2][0] + '">Келесі кезең →</button></div></div></div>';
  }

  function renderTabs() {
    const nav = document.getElementById('tabs');
    nav.innerHTML = TABS.map(([id, label], k) => '<button data-go="' + id + '"' + (st.view === id ? ' aria-current="true"' : '') + (k >= 1 && k <= 4 && st.won[k - 1] ? ' class="done"' : '') + '>' + label + '</button>').join('');
  }
  function go(view) { st.view = view; renderTabs(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });

  function render() {
    ({ start: vStart, g1: vG1, g2: vG2, g3: vG3, g4: vG4, final: vFinal })[st.view]();
  }

  function vStart() {
    app.innerHTML = '<section class="screen">' +
      '<div class="hero"><img src="' + IMG.earth + '" alt="Жартысы жасыл, жартысы шөл мен зауыттарға айналған Жер шары"><div class="hero-in"><p class="sos">SOS · SOS · SOS</p><h1>2050 жылдан хабарлама келді</h1><p class="lead" style="color:#D6E6E1">Геоэкологиядағы антропогендік факторлар · § 15, 53–56 б. · 10 «Б»</p></div></div>' +
      '<div class="letter">Сәлем, 10 «Б»! Мен — 2050 жылғы Жер. Ормандарым кесілді, топырағым жарамсыз болды, ауам ысып барады. Мұның бәрі адам әрекетінің ізі. Мені құтқару үшін <b>4 ойыннан</b> өтіп, <b>4 таңбалы кодты</b> табыңдар. Әр дұрыс жауап үшін эко-тиын аласыңдар.</div>' +
      '<div class="row" style="align-items:flex-end"><label class="field" for="team">Команда атауы<input type="text" id="team" placeholder="Мысалы: Жасыл дала" value="' + esc(st.team) + '"></label><button class="btn" id="startBtn">Миссияны бастау</button></div>' +
      '<p class="note">Бұл бет интернетсіз де жұмыс істейді: файлды жүктеп алып, кез келген браузерде ашыңыз.</p></section>';
    document.getElementById('team').addEventListener('input', (e) => { st.team = e.target.value; });
    document.getElementById('startBtn').addEventListener('click', () => go('g1'));
  }

  function vG1() {
    if (!st.g1) st.g1 = { order: shuffle(GROUPS.map((g) => g.n)), asks: shuffle(GROUPS.map((g) => g.n)), k: 0, miss: 0, solved: [] };
    const s = st.g1; const done = s.k >= 7; const cur = GROUPS[s.asks[s.k] - 1];
    app.innerHTML = '<section class="screen"><p class="eyebrow">1-ойын · 20-сурет. Табиғатқа антропогендік факторлардың ықпалы · 54 б.</p><h2>Суретті тап</h2>' +
      (done ? winBanner(0, 'Табиғатқа антропогендік факторлардың ықпалының 7 түрі табылды (20-сурет). Код неге 7-ден басталады? Себебі оқулықта дәл 7 түрі берілген.') :
      '<div class="ask"><span class="pill">' + (s.k + 1) + ' / 7</span><span>Табыңдар:</span><strong>' + cur.name + '</strong></div><p class="feedback" id="fb" role="status"></p>') +
      '<div class="tiles">' + s.order.map((n) => { const g = GROUPS[n - 1]; const ok = s.solved.includes(n);
        return '<button class="tile' + (ok ? ' solved' : '') + '" data-n="' + n + '"' + (ok || done ? ' disabled' : '') + '><img src="' + IMG[g.img] + '" alt="' + (ok ? g.name : 'Жасырын сурет') + '"><div class="cap">' + (ok ? '<b>' + g.n + '. ' + g.name + '</b><br><span style="font-weight:600">' + g.fact + '</span>' : 'Бұл қай әсер?') + '</div></button>'; }).join('') + '</div></section>';
    if (done) return;
    app.querySelectorAll('.tile:not([disabled])').forEach((b) => b.addEventListener('click', () => {
      const fb = document.getElementById('fb');
      if (+b.dataset.n === cur.n) { s.solved.push(cur.n); s.k++; addCoins(s.miss ? 1 : 2); s.miss = 0; if (s.k >= 7) winGame(0); vG1(); }
      else { s.miss++; shakeEl(b); fb.className = 'feedback bad'; fb.textContent = 'Жоқ, бұл басқа әсер. Оқулықтың 20-суретіне қараңдар.'; }
    }));
  }

  function vG2() {
    if (!st.g2) st.g2 = { k: 0, answered: null, miss: 0 };
    const s = st.g2;
    if (s.k >= CLUES.length) { app.innerHTML = '<section class="screen"><p class="eyebrow">2-ойын · Экологиялық детектив</p><h2>Барлық күдікті әшкере болды</h2>' + winBanner(1, 'Тергеу аяқталды! Енді сыныпта ЖИ-«күдіктіден» нақты жауап алыңдар.') + '</section>'; return; }
    const c = CLUES[s.k];
    app.innerHTML = '<section class="screen"><p class="eyebrow">2-ойын · Экологиялық детектив · Іс № 2050</p><h2>Кім мойындап тұр?</h2>' +
      '<div class="card"><div class="row"><span class="pill">Айғақ ' + (s.k + 1) + ' / ' + CLUES.length + '</span></div><p class="quote">«' + c.q + '»</p>' +
      '<div class="choices">' + SUSPECTS.map((x) => '<button class="choice" data-id="' + x.id + '">' + ICON[x.id] + '<span>' + x.name + '</span></button>').join('') + '</div><div id="ex"></div></div></section>';
    app.querySelectorAll('.choice').forEach((b) => b.addEventListener('click', () => {
      const ex = document.getElementById('ex');
      if (b.dataset.id === c.a) {
        app.querySelectorAll('.choice').forEach((x) => { x.disabled = true; }); b.classList.add('right'); addCoins(s.miss ? 1 : 2);
        ex.innerHTML = '<div class="explain"><b>Дұрыс!</b> 20-суреттегі топ: ' + c.g + '</div><div class="row" style="margin-top:12px"><button class="btn" id="nx">Келесі айғақ →</button></div>';
        document.getElementById('nx').addEventListener('click', () => { s.k++; s.miss = 0; if (s.k >= CLUES.length) winGame(1); vG2(); });
      } else { s.miss++; b.classList.add('wrong'); b.disabled = true; shakeEl(b); ex.innerHTML = '<div class="explain no">Бұл күдікті ақталды. Айғақты қайта оқыңдар.</div>'; }
    }));
  }

  function vG3() {
    if (!st.g3) st.g3 = { deck: shuffle(SORT), k: 0, miss: 0, wrongTotal: 0, t0: null, t: 0 };
    const s = st.g3;
    if (s.k >= s.deck.length) {
      const sec = Math.round(s.t / 1000);
      app.innerHTML = '<section class="screen"><p class="eyebrow">3-ойын · Сұрыптау жарысы</p><h2>14 карточка сұрыпталды</h2><div class="row"><span class="pill">Уақыт: ' + Math.floor(sec / 60) + ' мин ' + (sec % 60) + ' с</span><span class="pill">Қателер: ' + s.wrongTotal + '</span></div>' + winBanner(2, 'Жарыс аяқталды! Нәтижені тақтаға жазыңдар: ең жылдам әрі ең аз қателескен команда жеңеді.') + '</section>';
      return;
    }
    if (!s.t0) s.t0 = Date.now();
    const [text, ans] = s.deck[s.k];
    app.innerHTML = '<section class="screen"><p class="eyebrow">3-ойын · Сұрыптау жарысы</p><h2>Бұл қай топқа жатады?</h2>' +
      '<div class="row"><span class="pill">' + (s.k + 1) + ' / 14</span><span class="pill" id="clock">0 с</span><span class="pill">Қателер: ' + s.wrongTotal + '</span></div>' +
      '<div class="deck"><div class="sortcard" id="sc">' + text + '</div></div><p class="feedback" id="fb" role="status"></p>' +
      '<div class="groups">' + GROUPS.map((g) => '<button class="group" data-n="' + g.n + '"><img src="' + IMG[g.img] + '" alt=""><span>' + g.n + '. ' + g.name + '</span></button>').join('') + '</div></section>';
    const clock = document.getElementById('clock');
    clearInterval(s.timer); s.timer = setInterval(() => { if (st.view !== 'g3' || !document.getElementById('clock')) { clearInterval(s.timer); return; } clock.textContent = Math.round((Date.now() - s.t0) / 1000) + ' с'; }, 500);
    app.querySelectorAll('.group').forEach((b) => b.addEventListener('click', () => {
      const fb = document.getElementById('fb');
      if (+b.dataset.n === ans) {
        addCoins(s.miss ? 1 : 2); s.miss = 0; fb.className = 'feedback good'; fb.textContent = 'Дұрыс!';
        document.getElementById('sc').classList.add('fly');
        setTimeout(() => { s.k++; if (s.k >= s.deck.length) { s.t = Date.now() - s.t0; clearInterval(s.timer); winGame(2); } vG3(); }, 420);
      } else { s.miss++; s.wrongTotal++; shakeEl(b); shakeEl(document.getElementById('sc')); fb.className = 'feedback bad'; fb.textContent = 'Жоқ, қайта ойланыңдар.'; }
    }));
  }

  function vG4() {
    if (!st.g4) st.g4 = { k: 0 };
    const s = st.g4;
    if (s.k >= LIAR.length) { app.innerHTML = '<section class="screen"><p class="eyebrow">4-ойын · Өтірікшіні тап</p><h2>Барлық өтірік әшкере болды</h2>' + winBanner(3, 'Енді ЖИ-мен басқа командаға өз раундтарыңды құрастырыңдар. Бірақ алдымен оқулықпен тексеріңдер!') + '</section>'; return; }
    const r = LIAR[s.k]; const L = ['А', 'Ә', 'Б'];
    app.innerHTML = '<section class="screen"><p class="eyebrow">4-ойын · Өтірікшіні тап</p><h2>' + r.t + '</h2><p class="lead">Үш тұжырымның біреуі өтірік. Оны табыңдар.</p>' +
      '<div class="trio">' + r.c.map((t, i) => '<button class="claim" data-i="' + i + '"><b>' + L[i] + '</b><span>' + t + '</span></button>').join('') + '</div><div id="ex"></div></section>';
    let miss = 0;
    app.querySelectorAll('.claim').forEach((b) => b.addEventListener('click', () => {
      const ex = document.getElementById('ex');
      if (+b.dataset.i === r.lie) {
        app.querySelectorAll('.claim').forEach((x) => { x.disabled = true; }); b.classList.add('lie'); addCoins(miss ? 1 : 3);
        ex.innerHTML = '<div class="explain"><b>Өтірікші ұсталды!</b> ' + r.why + '</div><div class="row" style="margin-top:12px"><button class="btn" id="nx">' + (s.k < LIAR.length - 1 ? 'Келесі раунд →' : 'Цифрды ашу →') + '</button></div>';
        document.getElementById('nx').addEventListener('click', () => { s.k++; if (s.k >= LIAR.length) winGame(3); vG4(); });
      } else { miss++; b.classList.add('miss'); b.disabled = true; shakeEl(b); ex.innerHTML = '<div class="explain no">Бұл — шындық! Оқулықта осылай жазылған. Қайта іздеңдер.</div>'; }
    }));
  }

  function vFinal() {
    const allWon = st.won.every(Boolean);
    app.innerHTML = '<section class="screen"><p class="eyebrow">Финал · Құлыпты аш</p><h2>Болашақтан келген хат құлыптаулы</h2>' +
      '<p class="lead">' + (allWon ? 'Барлық 4 цифр жиналды. Оларды ретімен енгізіңдер.' : 'Әзірге ' + st.won.filter(Boolean).length + ' цифр табылды. Кодты болжап көруге болады, бірақ ойындардан өткен сенімдірек!') + '</p>' +
      '<form class="lock" id="lockForm" autocomplete="off"><svg class="padlock" id="padlock" viewBox="0 0 84 96" role="img" aria-label="Құлып"><path class="shackle" d="M24 44 V30 a18 18 0 0 1 36 0 V44" fill="none" stroke="#F0A85A" stroke-width="8" stroke-linecap="round"/><rect x="12" y="42" width="60" height="48" rx="10" fill="#D9793A"/><circle cx="42" cy="62" r="6" fill="#1A120B"/><rect x="39" y="64" width="6" height="12" rx="2" fill="#1A120B"/></svg>' +
      [0, 1, 2, 3].map((i) => '<input id="c' + i + '" inputmode="numeric" maxlength="1" aria-label="' + (i + 1) + '-цифр">').join('') +
      '<button class="btn" type="submit">Ашу</button></form><p class="feedback" id="fb" role="status"></p><div id="out"></div></section>';
    const ins = [0, 1, 2, 3].map((i) => document.getElementById('c' + i));
    ins.forEach((inp, i) => {
      inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(-1); if (inp.value && i < 3) ins[i + 1].focus(); });
      inp.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !inp.value && i > 0) ins[i - 1].focus(); });
    });
    document.getElementById('lockForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const code = ins.map((x) => x.value).join(''); const fb = document.getElementById('fb');
      if (code === '7168') {
        fb.className = 'feedback good'; fb.textContent = 'Құлып ашылды!'; document.getElementById('padlock').classList.add('open'); addCoins(5); confetti(140);
        ins.forEach((x) => { x.disabled = true; });
        const out = document.getElementById('out');
        out.innerHTML = '<div class="letter" style="margin-top:6px"><p class="eyebrow" style="margin-bottom:10px">2050 жылғы Қазақстаннан хат' + (st.team ? ' · «' + esc(st.team) + '» командасына' : '') + '</p><p class="typed" id="typed"></p></div>' +
          '<div class="card" style="margin-top:16px"><p class="eyebrow">Бонус сұрақ: код неге дәл 7168?</p><button class="btn ghost" id="bonus">Жауабын көрсету</button><div id="bonusOut"></div></div>' +
          '<div class="win" style="margin-top:16px"><img src="' + IMG.coin + '" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:center top"><p style="font-size:18px">Жиналған эко-тиын: <b style="font-size:26px;color:var(--amber)">' + st.coins + '</b></p></div>';
        typeText(document.getElementById('typed'), LETTER);
        document.getElementById('bonus').addEventListener('click', () => { document.getElementById('bonusOut').innerHTML = '<div class="explain"><b>7</b> — 20-суреттегі «Табиғатқа антропогендік факторлардың ықпалы» түрлерінің саны. <b>168</b> — күн энергиясы жер бетіне жұтылып, оны жылытатын мөлшер, Вт/м² (21-сурет, 55 б.).</div>'; });
      } else { fb.className = 'feedback bad'; fb.textContent = 'Код қате! Ойындарға оралып, цифрларды тексеріңдер.'; shakeEl(document.getElementById('lockForm')); }
    });
  }
  function typeText(el, text) {
    let i = 0; const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { el.textContent = text; el.classList.add('done'); return; }
    (function step() { el.textContent = text.slice(0, i); i += 2; if (i <= text.length + 1) setTimeout(step, 22); else { el.textContent = text; el.classList.add('done'); } })();
  }

  renderTabs(); render();
})();
</script>
</body></html>
