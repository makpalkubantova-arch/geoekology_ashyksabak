<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>📒 Хатшы · Геоэкология</title>
<link href="vendor/geo-fonts.css" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Golos Text','Segoe UI',Arial,sans-serif;background:#F5F7FB;color:#14213D}
.w{max-width:620px;margin:0 auto;padding:14px 12px 60px}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 22px rgba(20,33,61,.07);margin-top:12px}
h1{font-size:22px;margin:0}.mut{color:#5B6B86}
.gb{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:19px;font-weight:800;font-family:inherit;color:#fff;margin-top:10px;cursor:pointer;text-align:left}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;border:2px solid #E1E7F0;background:#fff;border-radius:12px;padding:8px 12px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;color:#14213D}
.tabs button.on{background:#14213D;color:#fff;border-color:#14213D}
.d{font-size:15px;font-weight:700;margin:12px 0 4px;color:#6C4BD8}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed #E1E7F0}
.row .n{flex:1;font-size:16px;font-weight:700}
.pts{display:flex;gap:6px}.pts button{width:44px;height:44px;border-radius:12px;border:2px solid #E1E7F0;background:#fff;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer;color:#14213D}
.pts button.on{background:#1E9E7A;color:#fff;border-color:#1E9E7A}
.all{background:#FFF8E6;border-radius:12px;padding:6px 8px}
.sum{position:sticky;bottom:0;background:#14213D;color:#fff;border-radius:16px;padding:12px 16px;margin-top:14px;font-weight:700;font-size:15px}
input{width:100%;font-size:17px;font-family:inherit;padding:12px;border-radius:12px;border:2px solid #E1E7F0;margin-top:8px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:800;font-family:inherit;background:#6C4BD8;color:#fff;cursor:pointer;margin-top:8px}

body{background:linear-gradient(180deg,#F4F8F2,#E6F0EC) fixed;font-family:'Nunito','Segoe UI',Arial,sans-serif;color:#142B26}
h1{font:800 22px 'Montserrat',sans-serif;color:#E07A1F}
.btn{background:linear-gradient(180deg,#F7B24A,#E07A1F)!important;font-family:'Montserrat',sans-serif}
.card{box-shadow:0 14px 30px -16px rgba(20,43,38,.35)}
.d{color:#C0661A;font-size:16px}
.pts button.on{background:#1E9A5A;border-color:#1E9A5A;color:#fff}
.tabs button.on{background:#17302A;border-color:#17302A;color:#F7B24A}
.sum{background:#17302A!important;color:#fff}
.all{background:#FFF4E2}
</style>
</head>
<body><div class="w"><h1>📒 Хатшы парағы · Геоэкология</h1><div class="mut" style="font-size:14px;font-weight:700">Жеңіл режим: тек 2 нәрсе — «Бүкіл топқа» басып, қажет болса біреуін түзетесіз. Қалғанын тақта өзі есептейді.</div><div class="mut" id="st">қосылуда…</div><div id="app"></div></div>
<script src="lesson-data.js"></script><script src="core.js"></script>
<script>
(async function () {
  const LD = window.LD, GT = window.GT, esc = GT.esc, app = document.getElementById('app');
  const code = GT.code(); if (!code) { app.innerHTML = '<div class="card">Тақтадағы хатшы QR-ын сканерлеңіз.</div>'; return; }
  const db = await GT.backend(); const P = 'games/' + code;
  const TASKS = LD.tasks.filter((t) => t.d.some((d) => d.by === 'sec'));
  let meta = {}, mine = {}, g = +(localStorage.getItem('ge_h_g_' + code) || -1), tk = TASKS[0].k, extra = [];
  try { extra = JSON.parse(localStorage.getItem('ge_h_x_' + code) || '[]'); } catch (e) {}
  document.getElementById('st').textContent = 'Сабақ коды: ' + code + (db.demo ? ' · демо' : '');
  draw();
  db.on(P + '/meta', (v) => { meta = v || {}; draw(); });
  let alt = false, mineSec = {}, mineAlt = {};
  const remix = () => { mine = Object.assign({}, mineAlt, mineSec); draw(); };
  db.on(P + '/sec/' + db.uid, (v) => { mineSec = v || {}; remix(); });
  db.on(P + '/guests/' + db.uid, (v) => { mineAlt = (v && v.items) || {}; if (v && v.items) alt = true; remix(); });
  /* хатшыға жауап кілті — тапсырманы өзі орындағаннан кейін ғана ашылады */
  function KEYOF(k, g) {
    if (k === 'K1') return 'Аймақтың мәселесін (не болып жатыр) және себебін атаса — 1 ұпай. Мысалы: Арал — су айналымының бұзылуы, себебі өзен суын суаруға алу.';
    if (k === 'K2') return '7 ықпал: ' + LD.factors.map((f) => `${f.n}) ${esc(f.short)} — ${esc(f.sphere)}`).join(' · ') + '. Барлығы дұрыс топтастырылса — 1 ұпай.';
    return '';
  }

  const KO = () => { try { return JSON.parse(localStorage.getItem('ge_h_k_' + code) || '{}'); } catch (e) { return {}; } };
  function members() {
    const r = GT.arr(meta.roster).map((p, i) => ({ key: 'r' + i, name: p.name, g: p.g, role: p.role })).filter((p) => p.g === g);
    return r.concat(extra.filter((p) => p.g === g));
  }
  function draw() {
    if (g < 0) {
      app.innerHTML = `<div class="card"><b>Қай топтың хатшысысыз?</b><div class="mut" style="margin:4px 0 8px">Тек өз тобыңды таңда — кейін ауыстырылмайды.</div>${LD.groups.map((x, i) => `<button class="gb" data-g="${i}" style="background:${x.c}">${x.icon} ${x.short} · ${esc(x.name)}</button>`).join('')}</div>`;
      app.querySelectorAll('[data-g]').forEach((b) => b.onclick = () => { if (!confirm(LD.groups[+b.dataset.g].name + ' — сенің тобың ба? Кейін ауыстырылмайды.')) return; g = +b.dataset.g; localStorage.setItem('ge_h_g_' + code, g); draw(); }); return;
    }
    const G = LD.groups[g], ms = members(), t = TASKS.find((x) => x.k === tk);
    let h = `<div class="card" style="border-top:6px solid ${G.c}"><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:${G.ink}">${G.icon} ${esc(G.name)}</b><span class="mut" style="font-size:13px">📒 тек өз тобың</span></div>
      <div class="tabs" style="margin-top:10px">${TASKS.map((x) => `<button data-k="${x.k}" class="${x.k === tk ? 'on' : ''}">${x.k}</button>`).join('')}</div>
      <div style="margin-top:8px;font-weight:800">${t.k} · ${esc(t.kind)}: ${esc(t.title)}</div>`;
    const kOpen = !!KO()[t.k], KT = KEYOF(t.k, g);
    h += kOpen ? `<div class="card" style="background:#FFF6D6;margin:10px 0;padding:12px">🔑 <b>Жауап кілті:</b> ${KT}</div>`
      : `<div class="card" style="background:#FFF6D6;margin:10px 0;padding:12px;text-align:center"><b>🔒 Жауап кілті жабық</b><div class="mut" style="margin:6px 0 10px">Алдымен тапсырманы өзің жұмыс парағында орында, сосын кілтті ашып, топты тексер.</div><button class="btn" id="kopen" style="margin:0">✅ Мен өзім орындадым — кілтті аш</button></div>`;
    h += `<div style="${kOpen ? '' : 'opacity:.35;pointer-events:none'}">`;
    if (!ms.length) h += `<p class="mut">Мұғалім тізімді әлі енгізбеген. Топ мүшелерін өзіңіз қоса аласыз:</p>`;
    t.d.forEach((d, di) => {
      if (d.by !== 'sec') return;
      const dk = t.k + '_' + di;
      h += `<div class="d">${di + 1}) ${esc(d.t)} — ${d.p} б.</div><div class="row all"><span class="n">👥 Бүкіл топқа</span><div class="pts">${[...Array(d.p + 1)].map((_, v) => `<button data-all="${dk}" data-v="${v}">${v}</button>`).join('')}</div></div>`;
      ms.forEach((p) => { const cur = ((mine[p.key] || {}).sc || {})[dk]; h += `<div class="row"><span class="n">${esc(p.name)}${p.role === 'hat' ? ' 📒' : p.role === 'sp1' || p.role === 'sp2' ? ' 🎤' : p.role === 'pos' ? ' 🖼️' : ''}</span><div class="pts">${[...Array(d.p + 1)].map((_, v) => `<button data-p="${p.key}" data-dk="${dk}" data-v="${v}" class="${cur === v ? 'on' : ''}">${v}</button>`).join('')}</div></div>`; });
    });
    h += `</div>`;
    h += `<div style="display:flex;gap:8px"><input id="addn" placeholder="+ Оқушы қосу (тізімде жоқ болса)"><button class="btn" id="add">Қосу</button></div></div>`;
    h += `<div class="sum">${ms.map((p) => `${esc(p.name.split(' ')[0])}: <b>${(mine[p.key] || {}).total || 0}</b>`).join(' · ') || 'Ұпай әлі жоқ'} <span style="opacity:.7">(басқа ұпайлар тақтадан және квизден өзі қосылады)</span></div>`;
    app.innerHTML = h;
    
    const ko = document.getElementById('kopen'); if (ko) ko.onclick = () => { if (!confirm('Тапсырманы өзің орындап болдың ба?')) return; const o = KO(); o[t.k] = 1; localStorage.setItem('ge_h_k_' + code, JSON.stringify(o)); draw(); };
    app.querySelectorAll('.tabs [data-k]').forEach((b) => b.onclick = () => { tk = b.dataset.k; draw(); });
    app.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => save([b.dataset.p], b.dataset.dk, +b.dataset.v));
    app.querySelectorAll('[data-all]').forEach((b) => b.onclick = () => save(members().map((p) => p.key), b.dataset.all, +b.dataset.v));
    document.getElementById('add').onclick = () => { const n = document.getElementById('addn').value.trim(); if (n.length < 2) return; extra.push({ key: 'x' + Date.now().toString(36), name: n, g }); localStorage.setItem('ge_h_x_' + code, JSON.stringify(extra)); draw(); };
  }
  function flash(t) { let f = document.getElementById('fl'); if (!f) { f = document.createElement('div'); f.id = 'fl'; f.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0FA968;color:#fff;font-weight:800;padding:10px 18px;border-radius:14px;z-index:9;transition:opacity .4s'; document.body.appendChild(f); } f.textContent = t; f.style.opacity = 1; clearTimeout(f._t); f._t = setTimeout(() => f.style.opacity = 0, 900); }
  async function save(keys, dk, v) {
    const ms = members(); const upd = {};
    keys.forEach((k) => {
      const p = ms.find((x) => x.key === k); if (!p) return;
      const e = mine[k] || { name: p.name, g, sc: {} }; const sc = Object.assign({}, e.sc || {}, { [dk]: v });
      const total = Object.values(sc).reduce((a, b) => a + (+b || 0), 0);
      upd[k] = { name: p.name, g, sc, total, src: 'hatshy' };
    });
    const ok = () => { if (navigator.vibrate) navigator.vibrate(15); flash('✓ сақталды'); };
    if (!alt) { try { await db.update(P + '/sec/' + db.uid, upd); return ok(); } catch (e) { alt = true; } }
    /* қосалқы жол: Rules-та sec жоқ болса — guests арқылы сақтаймыз */
    try { const items = Object.assign({}, mine, upd); await db.set(P + '/guests/' + db.uid, { kind: 'sec', g, items }); mineAlt = items; ok(); }
    catch (e) { alert('Сақталмады: ' + (e.code || e.message) + '\nИнтернетті тексеріңіз немесе ұпайды қағаз хатшы парағына жазыңыз.'); }
  }
})();
</script>
</body>
</html>
