<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<title>Тақта пульті · Антропогендік факторлар</title>
<link rel="stylesheet" href="../vendor/golos.css">
<script src="lesson-data.js"></script><script src="../vendor/qrcode.js"></script><script src="icons.js"></script>
<style>
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Golos Text',sans-serif;color:#13233a;background:#d9e3ee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:297mm;height:210mm;background:#fff;margin:0 auto;padding:7mm 8mm;display:flex;flex-direction:column;gap:2.4mm;overflow:hidden}
@media print{body{background:#fff}}
.hd{display:flex;gap:4mm;align-items:center;background:linear-gradient(110deg,#165C33,#1F7A45 60%,#43B36B);color:#fff;border-radius:9mm 2mm 9mm 2mm;padding:3mm 5mm}
.hd .k{font-size:8pt;font-weight:800;letter-spacing:.14em;color:#c9f0a8}
.hd h1{font-size:17pt;font-weight:800;line-height:1.05;margin:.5mm 0}
.hd p{font-size:9pt;opacity:.95}
.qrs{margin-left:auto;display:flex;gap:2.5mm}
.qr{background:#fff;border-radius:2.5mm;padding:1mm;width:18mm;text-align:center;color:#165C33;font-size:6.5pt;font-weight:800}
.qr svg{width:100%;display:block}
table{width:100%;border-collapse:separate;border-spacing:0 .6mm;font-size:6.6pt;line-height:1.1;table-layout:fixed}
th{font-size:7pt;text-align:left;color:#5B6B66;font-weight:800;letter-spacing:.05em;padding:0 1.5mm;text-transform:uppercase}
td{background:#f4faf6;padding:.55mm 1.4mm;vertical-align:middle}
td:first-child{border-radius:2.5mm 0 0 2.5mm;width:10mm;text-align:center;padding:0}
td:last-child{border-radius:0 2.5mm 2.5mm 0}
.no{display:inline-grid;place-items:center;width:6mm;height:6mm;border-radius:50%;color:#fff;font-weight:800;font-size:8.5pt}
.t b{font-size:7.2pt}.t i{font-style:normal;color:#5B6B66}
.mn{font-weight:800;color:#165C33;white-space:nowrap}
.k{font-weight:800}
.chip{display:inline-block;border-radius:9mm;padding:.2mm 1.4mm;font-weight:800;font-size:6.2pt;color:#fff;margin:.2mm .4mm .2mm 0}
tr.ph td{background:none;padding:.3mm 1.5mm 0;font-size:6.6pt;font-weight:800;letter-spacing:.1em;text-align:left!important}
.ft{display:flex;gap:3mm;font-size:6.9pt;line-height:1.25}
.ft div{flex:1;background:#f4faf6;border-radius:3mm;padding:1.6mm 2.2mm}
.ft b{color:#165C33}
</style></head><body>
<script>
const D = window.LD, SITE = "https://makpalkubantova-arch.github.io/geoekology_ashyksabak/";
function qrSvg(t){const q=qrcode(0,"H");q.addData(t);q.make();const n=q.getModuleCount(),m=2,S=n+m*2;let p="";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`<rect x="${c+m}" y="${r+m}" width="1.02" height="1.02" rx=".3"/>`;return `<svg viewBox="0 0 ${S} ${S}"><rect width="${S}" height="${S}" fill="#fff"/><g fill="#165C33">${p}</g></svg>`}
const PC = ["#2E7D4F", "#1F7A45", "#C0661A", "#1661A3", "#5B6B66"];
const STK = { groups: "капсулалар, рөл белгілері, үстел тақтайшалары", poster: "постер инфографикасы, «2 жұлдыз, 1 тілек»", feedback: "«Экоуәде ағашы» алмалары", ball: "медальдар" };
let tm = 0, ph = -1, rows = "";
D.STAGES.forEach((s, i) => {
  if (s.ph !== ph) { ph = s.ph; rows += `<tr class="ph"><td colspan="6" style="color:${PC[ph]}">${D.PHASES[ph].toUpperCase()}</td></tr>`; }
  const k = D.K[s.id], kk = D.KK[s.id], cr = kk ? D.CR.find(c => c.k === kk) : null;
  const res = [kk ? `<span class="chip" style="background:#165C33">${kk} · ${cr.p} балл</span>` : "", D.SHEET[s.id] ? `<span class="chip" style="background:#C0661A">парақ ${D.SHEET[s.id]}</span>` : "", STK[s.id] ? `<span class="chip" style="background:#1661A3">${STK[s.id]}</span>` : ""].join("");
  rows += `<tr><td><span class="no" style="background:${PC[s.ph]}">${i + 1}</span></td><td class="t"><b>${s.title}</b> <i>· ${s.method}</i></td><td class="mn">${tm}–${tm + s.min}′ <small>(${s.min})</small></td><td>${k[2]}</td><td>${k[1]}</td><td>${res}</td></tr>`;
  tm += s.min;
});
document.body.innerHTML = `<section class="page">
 <div class="hd"><div><div class="k">ТАҚТА ПУЛЬТІ · МҰҒАЛІМНІҢ БІР БЕТТІК ШПАРГАЛКАСЫ</div><h1>16 кезең — 16 батырма · 45 минут</h1><p>§ 15 «Геоэкологиядағы антропогендік факторлар» · 10 «Б» · ${D.teacher} · тақтаның төменгі жолағындағы нөмірлі батырмалар осы кестеге сәйкес</p></div>
 <div class="qrs"><div class="qr">${qrSvg(SITE + "live/host.html")}Тақта</div><div class="qr">${qrSvg(SITE + "materialdar.html")}Материалдар</div></div></div>
 <table><colgroup><col style="width:9mm"><col style="width:68mm"><col style="width:15mm"><col style="width:52mm"><col><col style="width:44mm"></colgroup><tr><th></th><th>Кезең · әдіс</th><th>Уақыт</th><th>Тақтада не басамын</th><th>Оқушылар</th><th>Балл · парақ · наклейка</th></tr>${rows}</table>
 <div class="ft"><div><b>Бастау алдында:</b> host.html ашу → ойын коды шығады. 3-кезеңде «🫧 Капсулаларды ашу»; хатшылар QR арқылы hatshy.html ашады.</div><div><b>Телефон тек 2 жерде:</b> хатшы (K1–K6 балл) және 12–13-кезеңде квиз (join.html QR). Қалғаны — тақта, парақ, постер.</div><div><b>Баға:</b> K1–K7 = ${D.CR.reduce((a, c) => a + c.p, 0)} ұпай → 10 балл (8–10 жоғары · 4–7 орта · 1–3 төмен). 14-кезеңде кесте → «📋 Excel».</div></div>
</section>`;
</script>
</body></html>
