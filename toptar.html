<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Экожүйе капсулалары</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a light "capsule wall" — closed capsules in a grid on the left, the three ecosystem teams filling up on the right */
:root {
  --bg: #F7F3EA; --card: #FFFFFF; --ink: #17302A; --muted: #55675F; --line: #E2DACB; --amber: #C9661B;
  --t0: #2E7D4F; --t0-bg: #E2F2E7; --t1: #1F6FA8; --t1-bg: #E0EEF8; --t2: #B5651D; --t2-bg: #FBEBDB;
  --display: 'Montserrat', 'Arial Black', Arial, sans-serif;
  --body: 'Nunito', 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
p { margin: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; line-height: 1.1; text-wrap: balance; }
#app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: var(--amber); }
.lead { color: var(--muted); font-size: clamp(16px, 1.5vw, 20px); max-width: 68ch; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.big { background: var(--amber); color: #fff; border: none; border-radius: 14px; padding: 14px 26px; font-family: var(--display); font-weight: 800; font-size: clamp(17px, 1.6vw, 22px); }
.ghost { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 16px; font-weight: 800; }
textarea { width: 100%; min-height: 170px; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: #fff; color: var(--ink); resize: vertical; }
.eco3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .eco3 { grid-template-columns: minmax(0, 1fr); } }
.eco { border-radius: 20px; overflow: hidden; border: 3px solid; display: flex; flex-direction: column; background: var(--card); }
.eco img { width: 100%; aspect-ratio: 16 / 8; object-fit: cover; display: block; }
.eco .b { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.eco input { font: inherit; font-family: var(--display); font-weight: 800; font-size: 19px; border: none; border-bottom: 2px dashed var(--line); background: transparent; color: var(--ink); padding: 4px 2px; min-width: 0; width: 100%; }
.eco small { color: var(--muted); font-weight: 700; }

/* reveal */
.stage { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.turn { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.turn .who { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 3.2vw, 46px); animation: pop .45s ease; }
.turn .hint { color: var(--muted); font-weight: 700; }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(96px, 30%), 1fr)); gap: 10px; perspective: 900px; }
.cap { position: relative; aspect-ratio: 3 / 4; border: none; padding: 0; background: transparent; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,.9,.3,1.15); }
.cap .f, .cap .k { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden; }
.cap .f { background: linear-gradient(160deg, #24453D, #17302A); color: #F3EFE4; border: 3px solid #2F5A50; box-shadow: 0 6px 14px rgba(23,48,42,.25); }
.cap .f b { font-family: var(--display); font-size: clamp(22px, 2.4vw, 34px); color: #F0A85A; }
.cap .f svg { opacity: .9; }
.cap:hover:not(:disabled) { transform: translateY(-4px); }
.cap.open { transform: rotateY(180deg); }
.cap .k { transform: rotateY(180deg); color: #fff; padding: 6px; text-align: center; }
.cap .k img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
.cap .k span { position: relative; font-family: var(--display); font-weight: 800; font-size: clamp(11px, 1.05vw, 14px); line-height: 1.15; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.cap .k em { position: relative; font-style: normal; font-weight: 800; font-size: clamp(11px, 1vw, 13px); background: rgba(255,255,255,.92); color: var(--ink); border-radius: 999px; padding: 2px 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cap:disabled { cursor: default; }
.cols { display: flex; flex-direction: column; gap: 10px; }
.col { border-radius: 18px; border: 3px solid; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--card); }
.col h3 { font-size: clamp(16px, 1.5vw, 20px); display: flex; justify-content: space-between; gap: 8px; }
.col h3 span { font-variant-numeric: tabular-nums; }
.names { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { color: #fff; border-radius: 999px; padding: 4px 10px; font-weight: 800; font-size: 14px; animation: fly .55s cubic-bezier(.2,.9,.3,1.2); }

/* reveal overlay */
.flash { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; background: rgba(23,48,42,.55); animation: fade .25s ease; padding: 16px; }
.flash .box { background: var(--card); border-radius: 26px; overflow: hidden; width: min(560px, 100%); text-align: center; animation: pop .5s cubic-bezier(.2,.9,.3,1.3); border: 5px solid; }
.flash img { width: 100%; aspect-ratio: 16 / 8; object-fit: cover; display: block; }
.flash .t { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 8px; }
.flash .nm { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 3.2vw, 42px); }
.flash .tm { font-family: var(--display); font-weight: 800; font-size: clamp(20px, 2.2vw, 30px); }
.flash .mot { color: var(--muted); font-weight: 700; }

/* final */
.final3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .final3 { grid-template-columns: minmax(0, 1fr); } }
.fcol { border-radius: 22px; overflow: hidden; border: 3px solid; background: var(--card); animation: rise .5s ease both; }
.fcol img { width: 100%; aspect-ratio: 16 / 7; object-fit: cover; display: block; }
.fcol .b { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.fcol h2 { font-size: clamp(20px, 2vw, 28px); }
.fcol ol { margin: 0; padding-left: 22px; font-weight: 800; font-size: 17px; display: grid; gap: 2px; }
.mission { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px 18px; font-size: clamp(16px, 1.4vw, 19px); }
.note { color: var(--muted); font-weight: 700; font-size: 14px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.confetti i { position: absolute; top: -20px; width: 11px; height: 17px; border-radius: 3px; animation: fall linear forwards; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
@keyframes fly { from { opacity: 0; transform: translateY(-24px) scale(.7); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

      '<div class="stage"><div class="wall">' + st.slots.map((t, i) => { const o = st.opened[i];
        return '<button class="cap' + (o ? ' open' : '') + '" data-i="' + i + '"' + (o || !cur ? ' disabled' : '') + ' aria-label="' + (o ? esc(o) + ', ' + st.names[t] : (i + 1) + '-капсула') + '"><span class="f">' + leaf + '<b>' + (i + 1) + '</b></span><span class="k" style="background:' + TEAMS[t].hex + '"><img src="' + IMG[TEAMS[t].key] + '" alt=""><span>' + esc(st.names[t]) + '</span>' + (o ? '<em>' + esc(o) + '</em>' : '') + '</span></button>'; }).join('') + '</div>' +
      '<div class="cols">' + TEAMS.map((t, i) => '<div class="col" style="border-color:' + t.color + ';background:' + t.bg + '"><h3 style="color:' + t.color + '">' + esc(st.names[i]) + '<span>' + st.teams[i].length + '</span></h3><div class="names">' + st.teams[i].map((n) => '<span class="chip" style="background:' + t.hex + '">' + esc(n) + '</span>').join('') + '</div></div>').join('') +
      '<div class="row">' + (cur ? '<button class="ghost" id="skip">Келесі оқушы</button><button class="ghost" id="auto">Қалғандарын бірден бөлу</button>' : '<button class="big" id="done">Топтар дайын →</button>') + '</div></div></div>';
    app.querySelectorAll('.cap:not([disabled])').forEach((b) => b.addEventListener('click', () => openCap(+b.dataset.i, b)));
    if ($('skip')) $('skip').addEventListener('click', () => { st.queue.push(st.queue.splice(st.k, 1)[0]); vReveal(); });
    if ($('auto')) $('auto').addEventListener('click', () => { const free = st.slots.map((t, i) => i).filter((i) => !st.opened[i]); for (; st.k < st.queue.length; st.k++) { const i = free.shift(); st.opened[i] = st.queue[st.k]; st.teams[st.slots[i]].push(st.queue[st.k]); } vFinal(); });
    if ($('done')) $('done').addEventListener('click', vFinal);
  }
  function openCap(i, btn) {
    const cur = st.queue[st.k]; if (!cur || st.opened[i]) return;
    const t = st.slots[i]; st.opened[i] = cur; st.teams[t].push(cur); st.k++;
    btn.classList.add('open');
    app.querySelectorAll('.cap').forEach((b) => { b.disabled = true; });
    setTimeout(() => {
      const T = TEAMS[t];
      const ov = document.createElement('div'); ov.className = 'flash'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', cur + ' — ' + st.names[t]);
      ov.innerHTML = '<div class="box" style="border-color:' + T.hex + '"><img src="' + IMG[T.key] + '" alt=""><div class="t"><p class="nm">' + esc(cur) + '</p><p class="tm" style="color:' + T.hex + '">' + esc(st.names[t]) + '</p><p class="mot">' + T.motto + '</p><div class="row" style="justify-content:center"><button class="big" id="ok" style="background:' + T.hex + '">' + (st.k < st.queue.length ? 'Келесі оқушы →' : 'Нәтижені көру →') + '</button></div></div></div>';
      document.body.appendChild(ov); confetti(60, T.hex);
      const close = () => { ov.remove(); vReveal(); };
      ov.querySelector('#ok').addEventListener('click', close); ov.querySelector('#ok').focus();
    }, 650);
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ roster: st.roster, names: st.names, teams: st.teams, ts: Date.now() })); return true; } catch (e) { return false; }
  }
  function vFinal() {
    const ok = save();
    app.innerHTML = '<p class="eyebrow">Топтар дайын</p><h1 style="font-size:clamp(30px,4.2vw,54px)">Үш экожүйе — үш команда</h1>' +
      '<div class="final3">' + TEAMS.map((t, i) => '<div class="fcol" style="border-color:' + t.color + ';animation-delay:' + (i * .15) + 's"><img src="' + IMG[t.key] + '" alt=""><div class="b"><h2 style="color:' + t.color + '">' + esc(st.names[i]) + '</h2><p class="note">' + t.motto + '</p><ol>' + st.teams[i].map((n) => '<li>' + esc(n) + '</li>').join('') + '</ol></div></div>').join('') + '</div>' +
      '<div class="mission"><b>Топтың рөлдері (1 минут):</b> тергеуші — тапсырманы оқиды; тексеруші — оқулықтан тексереді; хатшы — цифрларды жазады; спикер — жауапты айтады.</div>' +
      '<div class="row"><a class="big" href="live/host.html" style="text-decoration:none">Сабақты тақтада бастау →</a><button class="ghost" id="again">Қайта бөлу</button><button class="ghost" id="copy">Тізімді көшіру</button><span class="note" id="cpn" role="status">' + (ok ? 'Топтар келесі ойынға сақталды.' : 'Топтар сақталмады: келесі ойында тізімді қайта енгізіңіз.') + '</span></div>';
    confetti(150);
    $('again').addEventListener('click', vSetup);
    $('copy').addEventListener('click', () => { const txt = TEAMS.map((t, i) => st.names[i] + ':\n' + st.teams[i].map((n, k) => (k + 1) + '. ' + n).join('\n')).join('\n\n');
      try { navigator.clipboard.writeText(txt).then(() => { $('cpn').textContent = 'Көшірілді!'; }, () => { $('cpn').textContent = 'Көшіру мүмкін болмады.'; }); } catch (e) { $('cpn').textContent = 'Көшіру мүмкін болмады.'; } });
  }
  vSetup();
})();
</script>
</body></html>
