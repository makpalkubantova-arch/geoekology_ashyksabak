<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Геоэкологиядағы антропогендік факторлар — ашық сабақ · 10 «Б»</title>
<link href="vendor/geo-fonts.css" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
:root{--bg1:#F4F8F2;--bg2:#E6F0EC;--ink:#142B26;--mut:#4F6660;--line:rgba(20,43,38,.12);--amber:#E07A1F;--amber2:#F7B24A;--good:#1E9A5A;--good-bg:#DDF5E7;--bad:#D2452F;--bad-bg:#FCE4DF;--display:'Montserrat','Arial Black',Arial,sans-serif;--body:'Nunito','Segoe UI',Roboto,Arial,sans-serif;--deep:#17302A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0E1F1B;font-family:var(--body);color:var(--ink);overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1080px;position:relative;transform-origin:center center;overflow:hidden;flex:none;background:radial-gradient(1200px 700px at 10% -10%,#FFF4E2 0%,transparent 60%),radial-gradient(1000px 700px at 110% 10%,#DDF1FF 0%,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg2))}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.08}
.glass{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.8));border:1px solid rgba(255,255,255,.9);border-radius:26px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 18px 40px -18px rgba(20,43,38,.35),0 2px 6px rgba(20,43,38,.06)}
header{position:absolute;left:24px;right:24px;top:16px;height:92px;display:flex;align-items:center;gap:18px;padding:0 14px 0 14px;z-index:20}
.num{flex:none;width:66px;height:66px;border-radius:20px;background:linear-gradient(180deg,var(--amber2),var(--amber));color:#fff;font:900 32px var(--display);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 22px -8px rgba(224,122,31,.7)}
.ttl{flex:1;min-width:0}
.ttl small{display:block;font-size:17px;color:var(--mut);font-weight:800;letter-spacing:.3px}
.ttl b{display:block;font:800 38px/1.15 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--deep)}
#ribbon{display:flex;gap:8px}
#ribbon span{display:flex;align-items:center;gap:8px;border-radius:16px;padding:8px 14px;font:800 19px var(--display);color:#fff;min-width:112px;justify-content:space-between;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
#ribbon b{font-size:26px}
#timer{display:flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:6px 8px 6px 18px;border:1px solid var(--line)}
#tval{font:900 50px var(--display);font-variant-numeric:tabular-nums;min-width:160px;text-align:center}
#timer.low #tval{color:var(--bad)}
#timer.run{box-shadow:0 0 0 4px rgba(247,178,74,.45)}
.tb{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:#F6F1E6;font-size:22px;cursor:pointer;font-family:var(--display);font-weight:800;color:var(--ink)}
#tplay{background:linear-gradient(180deg,var(--amber2),var(--amber));color:#fff;border:0}
#method{position:absolute;left:24px;right:24px;top:120px;height:80px;z-index:10;display:flex;align-items:center;gap:14px;padding:0 20px}
#method .lab{flex:none;background:var(--deep);color:#F7B24A;border-radius:14px;padding:10px 14px;font:800 17px var(--display);letter-spacing:2px}
#method .nm{font:800 30px var(--display);color:var(--amber);white-space:nowrap}
#method .es{font-size:23px;font-weight:700;color:var(--mut);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;font-size:18px;font-weight:800;background:#EEF3EF;color:var(--ink);white-space:nowrap}
.chip.k{background:#FFF1DA;color:#8C4A12;cursor:pointer}
.chip.sh{background:#E1F0FB;color:#124E86}
#body{position:absolute;left:24px;right:24px;top:214px;bottom:100px;display:grid;grid-template-columns:400px 1fr;gap:22px;z-index:5}
.how{background:linear-gradient(165deg,#1F4A40,#17302A);color:#fff;border-radius:28px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 40px -18px rgba(20,43,38,.6);min-height:0;overflow:hidden}
.how h3{font-size:19px;letter-spacing:2px;color:var(--amber2)}
.how ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.how li{display:flex;gap:12px;font-size:23px;line-height:1.28;font-weight:700}
.how li b{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,var(--amber2),var(--amber));color:#fff;font:800 20px var(--display);display:flex;align-items:center;justify-content:center}
.say{margin-top:auto;background:rgba(255,255,255,.08);border:2px dashed rgba(247,178,74,.55);border-radius:18px;padding:12px 14px;font-size:19px;line-height:1.35}
.say h4{margin:0 0 4px;color:var(--amber2);font:800 15px var(--display);letter-spacing:1.5px}
.say i{display:block;font-style:normal}
.task{position:relative;min-height:0;animation:zin .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes zin{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.86));border:1px solid rgba(255,255,255,.9);border-radius:26px;box-shadow:0 18px 40px -18px rgba(20,43,38,.35);padding:22px 26px;position:relative}
.dark{background:linear-gradient(180deg,rgba(14,32,52,.92),rgba(8,20,36,.88));color:#fff;border-color:rgba(255,255,255,.14)}
.mut{color:var(--mut)}
.btn{position:relative;border:0;border-radius:16px;padding:14px 24px;font:800 21px var(--display);cursor:pointer;background:linear-gradient(180deg,var(--amber2),var(--amber));color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 -3px 0 rgba(0,0,0,.12) inset,0 10px 22px -8px rgba(224,122,31,.7)}
.btn.sec{background:rgba(255,255,255,.9);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 14px -10px rgba(20,43,38,.4)}
.btn.green{background:linear-gradient(180deg,#5CCB86,#1E9A5A);box-shadow:0 10px 22px -8px rgba(30,154,90,.7)}
.btn.red{background:linear-gradient(180deg,#F07A64,#D2452F)}
.btn:disabled{opacity:.45;cursor:default;filter:grayscale(.5)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:22px}
table.t th{background:var(--deep);color:#fff;text-align:left;padding:11px 14px;font-family:var(--display);font-weight:700}
table.t th:first-child{border-top-left-radius:14px}table.t th:last-child{border-top-right-radius:14px}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line);background:#fff;vertical-align:middle}
footer{position:absolute;left:0;right:0;bottom:0;height:92px;display:flex;align-items:center;gap:12px;padding:0 24px 0 18px;z-index:30}
#prog{flex:1;display:flex;gap:6px;height:56px}
#prog i{flex:1;border-radius:14px;background:rgba(255,255,255,.8);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;cursor:pointer;position:relative;transition:.2s}
#prog i.done{background:var(--good-bg)}
#prog i.on{background:linear-gradient(180deg,var(--amber2),var(--amber));border-color:transparent;box-shadow:0 10px 22px -8px rgba(224,122,31,.7);transform:translateY(-3px)}
#prog i small{position:absolute;bottom:1px;right:6px;font-size:12px;color:var(--mut);font-weight:800}
#prog i.on small{color:#fff}
.fb{height:58px;min-width:58px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:24px;cursor:pointer;box-shadow:0 6px 14px -10px rgba(20,43,38,.4);font-family:var(--display);font-weight:800;color:var(--ink);padding:0 12px}
.fb.nav{background:var(--deep);color:#F7B24A;min-width:74px;font-size:28px;border:0}
#gmed{width:74px;height:74px;flex:none;cursor:pointer;filter:drop-shadow(0 6px 10px rgba(20,43,38,.3))}
#bub{position:absolute;left:100px;bottom:100px;z-index:40;max-width:820px;background:#fff;border:3px solid var(--amber2);border-radius:24px 24px 24px 6px;padding:14px 22px;font-size:25px;font-weight:700;line-height:1.35;box-shadow:0 16px 34px rgba(20,43,38,.25);transform-origin:left bottom;transition:.4s cubic-bezier(.2,.8,.2,1);opacity:0;transform:scale(.6);pointer-events:none}
#bub.on{opacity:1;transform:none}
#bub b{display:block;font:800 15px var(--display);color:var(--amber);letter-spacing:1px}
.ov{position:absolute;inset:0;z-index:60;background:rgba(14,31,27,.55);display:none}
.ov.on{display:block}
.drawer{position:absolute;top:0;right:0;bottom:0;width:900px;background:#FBFAF6;padding:28px 32px;overflow:auto;font-size:21px;animation:slide .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.drawer h2,.full h2{margin:0 0 10px;font-size:32px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.tabs button{border:1px solid var(--line);border-radius:12px;padding:10px 16px;font:800 18px var(--display);cursor:pointer;background:#fff;color:var(--ink)}
.tabs button.on{background:var(--deep);color:#F7B24A;border-color:transparent}
.full{position:absolute;inset:32px;background:#FBFAF6;border-radius:32px;padding:30px 36px;overflow:auto;animation:zin .4s both}
.x{position:absolute;right:22px;top:18px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:24px;cursor:pointer;z-index:3}
#banner{position:absolute;top:120px;left:50%;transform:translate(-50%,-260px);z-index:70;background:linear-gradient(180deg,var(--amber2),var(--amber));color:#fff;font:800 31px var(--display);padding:16px 34px;border-radius:20px;box-shadow:0 14px 30px rgba(0,0,0,.2);transition:.4s;white-space:nowrap}
#banner.on{transform:translate(-50%,0)}
#count{position:absolute;inset:0;z-index:65;display:none;align-items:center;justify-content:center;pointer-events:none}
#count.on{display:flex}
#count span{font:900 400px var(--display);color:rgba(210,69,47,.8);animation:pop 1s ease-out}
@keyframes pop{from{transform:scale(1.5);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:.8}}
.qrbox{background:#fff;border-radius:20px;padding:10px;display:inline-block}
.qrbox svg{display:block;width:100%;height:100%}
.lv{font-weight:900;border-radius:8px;padding:0 8px;font-size:17px}
.lvA{background:#DDF5E7;color:#165C33}.lvB{background:#FDEEDC;color:#8C4A12}.lvC{background:#FCE4DF;color:#8E2424}
.bar{height:14px;border-radius:8px;background:#E6EDE8;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#43B36B,#3FA4E8,#F2A541);transition:width .5s}
.gl{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:radial-gradient(1000px 700px at 60% 50%,#0B2340 0%,#030A18 65%,#01040B 100%)}
.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.1)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,10,22,.9) 0%,rgba(2,10,22,.55) 45%,rgba(2,10,22,.1) 75%)}
.ok-pop{animation:okp .5s cubic-bezier(.2,.8,.2,1)}
@keyframes okp{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.fopt{border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:16px;padding:10px 12px;font:800 19px/1.2 var(--body);cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center}
.fopt i{font-style:normal;font-size:28px}
.fopt.ok{background:#1E9A5A;border-color:#7BE0A6}.fopt.no{background:#D2452F;border-color:#FFB4A6}
.fopt:disabled{cursor:default}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <header class="glass">
    <div class="num" id="num">1</div>
    <div class="ttl"><small id="sub">География · 10 «Б»</small><b id="title">…</b></div>
    <div id="ribbon"></div>
    <div id="timer"><span id="tval">00:00</span><button class="tb" id="tplay" title="Бастау / тоқтату (Space)">▶</button><button class="tb" id="treset" title="Қайта">↺</button><button class="tb" id="tplus" title="+1 минут">+1</button></div>
  </header>
  <div id="method" class="glass"></div>
  <div id="body"></div>
  <footer>
    <svg id="gmed" viewBox="0 0 150 150" aria-label="Гид">
      <defs><radialGradient id="gold" cx="35%" cy="30%"><stop offset="0" stop-color="#FFE7B0"/><stop offset=".6" stop-color="#F7B24A"/><stop offset="1" stop-color="#C0661A"/></radialGradient><radialGradient id="sea" cx="35%" cy="30%"><stop offset="0" stop-color="#8FD3FF"/><stop offset="1" stop-color="#1661A3"/></radialGradient><clipPath id="gc"><circle cx="75" cy="75" r="56"/></clipPath></defs>
      <circle cx="75" cy="75" r="72" fill="url(#gold)"/><circle cx="75" cy="75" r="58" fill="url(#sea)"/>
      <g clip-path="url(#gc)"><g class="spin"><path d="M30 50 q14 -14 30 -6 q10 8 4 18 q-8 6 -2 14 q6 10 -6 16 q-14 2 -20 -10 q-8 -14 -6 -32z" fill="#43B36B"/><path d="M80 34 q20 -4 34 10 q8 12 -4 18 q-12 2 -14 12 q-2 12 -14 8 q-10 -6 -6 -18 q2 -10 -6 -16 q-2 -10 10 -14z" fill="#F2A541"/><path d="M84 92 q14 -4 22 6 q4 12 -8 18 q-12 4 -16 -6 q-4 -12 2 -18z" fill="#43B36B"/></g></g>
      <circle cx="75" cy="75" r="58" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/><ellipse cx="58" cy="52" rx="16" ry="9" fill="rgba(255,255,255,.35)" transform="rotate(-30 58 52)"/>
    </svg>
    <div id="prog"></div>
    <button class="fb" id="bScript" title="Мұғалім сөзі (M)">💬</button>
    <button class="fb" id="bAssess" title="Бағалау: критерий, дескриптор, нәтиже (B)">📋</button>
    <button class="fb" id="bRate" title="Рейтинг (R)">🏅</button>
    <button class="fb" id="bMat" title="Материалдар">📁</button>
    <button class="fb" id="bSet" title="Баптау: тізім, сілтемелер (T)">⚙️</button>
    <button class="fb nav" id="bp" title="Алдыңғы (←)">◀</button><button class="fb nav" id="bn" title="Келесі (→)">▶</button>
  </footer>
  <div id="bub"><b>🌍 ГИД · ЖЕР-АНА</b><span id="gtext"></span></div>
  <div id="banner"></div>
  <div id="count"><span id="cnum">10</span></div>
  <div class="ov" id="ov"></div>
</div></div>
<script src="lesson-data.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="core.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
